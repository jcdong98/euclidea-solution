<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- High-contrast rounded badge for crisp visibility on light & dark tab bars -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0f172a" />
  <rect x="3" y="3" width="58" height="58" rx="13" stroke="#334155" stroke-width="1.5" />

  <!-- Traced circle arc (compass locus) -->
  <path
    d="M 15 44 A 20 20 0 1 1 49 44"
    stroke="#38bdf8"
    stroke-width="4.2"
    stroke-linecap="round"
  />

  <!-- Straightedge baseline -->
  <line
    x1="10"
    y1="47"
    x2="54"
    y2="47"
    stroke="#34d399"
    stroke-width="4.4"
    stroke-linecap="round"
  />

  <!-- Drafting compass legs -->
  <path
    d="M 32 15 L 20 47 M 32 15 L 44 47"
    stroke="#f8fafc"
    stroke-width="4.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Compass top handle & hinge -->
  <line
    x1="32"
    y1="8.5"
    x2="32"
    y2="14"
    stroke="#f8fafc"
    stroke-width="4.2"
    stroke-linecap="round"
  />
  <circle cx="32" cy="15.5" r="5" fill="#fbbf24" stroke="#0f172a" stroke-width="2" />

  <!-- Anchor & intersection points -->
  <circle cx="20" cy="47" r="3.4" fill="#34d399" stroke="#0f172a" stroke-width="1.5" />
  <circle cx="44" cy="47" r="3.4" fill="#38bdf8" stroke="#0f172a" stroke-width="1.5" />
</svg>
